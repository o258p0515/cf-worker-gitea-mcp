name: Deploy Gitea MCP Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pre-deploy environment gate
        env:
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITEA_HOST: ${{ secrets.GITEA_HOST }}
          GITEA_ACCESS_TOKEN: ${{ secrets.GITEA_ACCESS_TOKEN }}
          GITEA_READONLY: ${{ secrets.GITEA_READONLY }}
          GITEA_SCOPES: ${{ secrets.GITEA_SCOPES }}
          GITEA_TOOLS: ${{ secrets.GITEA_TOOLS }}
          GITEA_TEST_OWNER: ${{ secrets.GITEA_TEST_OWNER }}
          GITEA_TEST_REPO: ${{ secrets.GITEA_TEST_REPO }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          MCP_API_PASSPHRASE: ${{ secrets.MCP_API_PASSPHRASE }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
        run: node scripts/check-env.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Generate VN version
        run: node scripts/gen-version.mjs
      - name: Render custom domain config
        env:
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: node -e 'const fs=require("fs");fs.writeFileSync("wrangler.deploy.jsonc",fs.readFileSync("wrangler.jsonc","utf8").replace("__CF_DOMAIN__",process.env.CF_DOMAIN))'
      - name: Diagnose Gitea and Cloudflare access
        env:
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          GITEA_HOST: ${{ secrets.GITEA_HOST }}
          GITEA_ACCESS_TOKEN: ${{ secrets.GITEA_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const domain=process.env.CF_DOMAIN;
          console.log("CF_DOMAIN:",domain.split(".").join(" [dot] "));
          const host=new URL(process.env.GITEA_HOST);
          console.log("GITEA_HOST:",host.protocol+"//"+host.hostname);
          const gr=await fetch(host.origin+"/api/v1/user",{headers:{Authorization:"token "+process.env.GITEA_ACCESS_TOKEN,Accept:"application/json"}});
          const gj=await gr.json().catch(()=>({}));
          console.log("Gitea API /user HTTP:",gr.status,"login:",gr.ok?gj.login:"(not authenticated)");
          const zr=await fetch("https://api.cloudflare.com/client/v4/zones?per_page=100",{headers:{"X-Auth-Email":process.env.CF_API_EMAIL,"X-Auth-Key":process.env.CF_API_KEY}});
          const zj=await zr.json();console.log("Global API key zones HTTP:",zr.status);
          if(!zr.ok)console.log("Zones API errors:",JSON.stringify(zj.errors));
          else {const zones=zj.result||[];console.log("Visible zone names:",zones.map(z=>z.name).join(", ")||"(none)");const matches=zones.filter(z=>domain===z.name||domain.endsWith("."+z.name));console.log("Matching zone:",matches.map(z=>z.name+" ["+z.id+"]").join(", ")||"(none)");}
          NODE
      - name: Deploy Worker
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
        run: npx wrangler deploy -c wrangler.deploy.jsonc
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          GITEA_HOST: ${{ secrets.GITEA_HOST }}
          GITEA_ACCESS_TOKEN: ${{ secrets.GITEA_ACCESS_TOKEN }}
          GITEA_EXTRA_HEADERS: ${{ secrets.GITEA_EXTRA_HEADERS }}
          GITEA_DEFAULT_OWNER: ${{ secrets.GITEA_DEFAULT_OWNER }}
          GITEA_DEFAULT_REPO: ${{ secrets.GITEA_DEFAULT_REPO }}
          GITEA_READONLY: ${{ secrets.GITEA_READONLY }}
          GITEA_SCOPES: ${{ secrets.GITEA_SCOPES }}
          GITEA_TOOLS: ${{ secrets.GITEA_TOOLS }}
          GITEA_TEST_OWNER: ${{ secrets.GITEA_TEST_OWNER }}
          GITEA_TEST_REPO: ${{ secrets.GITEA_TEST_REPO }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          MCP_API_PASSPHRASE: ${{ secrets.MCP_API_PASSPHRASE }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
          MCP_OAUTH_REDIRECT_URIS: ${{ secrets.MCP_OAUTH_REDIRECT_URIS }}
        run: |
          node -e 'const fs=require("fs");const ks="CF_DOMAIN GITEA_HOST GITEA_ACCESS_TOKEN GITEA_EXTRA_HEADERS GITEA_DEFAULT_OWNER GITEA_DEFAULT_REPO GITEA_READONLY GITEA_SCOPES GITEA_TOOLS GITEA_TEST_OWNER GITEA_TEST_REPO SWAGGER_USERNAME SWAGGER_PASSWORD MCP_TOKEN MCP_API_PASSPHRASE MCP_OAUTH_CLIENT_ID MCP_OAUTH_CLIENT_SECRET MCP_OAUTH_REDIRECT_URIS".split(" ");const o={};for(const k of ks)if(process.env[k])o[k]=process.env[k];fs.writeFileSync("/tmp/worker-secrets.json",JSON.stringify(o))'
          npx wrangler secret bulk /tmp/worker-secrets.json -c wrangler.deploy.jsonc
      - name: Production acceptance tests
        env:
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          GITEA_ACCESS_TOKEN: ${{ secrets.GITEA_ACCESS_TOKEN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          MCP_API_PASSPHRASE: ${{ secrets.MCP_API_PASSPHRASE }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
        run: node scripts/test-production.mjs
      - name: V2 T14 production parity and smoke tests
        env:
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        run: node scripts/test-production-v2.mjs
